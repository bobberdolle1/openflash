[package]
name = "openflash-cli"
description = "Command-line interface for the OpenFlash NAND/eMMC/NOR programmer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["nand", "flash", "programmer", "cli", "embedded"]
categories = ["command-line-utilities", "embedded", "hardware-support"]

[[bin]]
name = "openflash"
path = "src/main.rs"

[features]
default = ["usb"]
usb = ["openflash-core/usb"]

[dependencies]
openflash-core = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
indicatif = "0.17"
console = "0.15"
colored = "2.0"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
