[package]
name = "openflash-core"
description = "Core library for the OpenFlash NAND/eMMC/NOR programmer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
openflash-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# USB support is optional so that dump analysis, the emulator and the test suite
# build on hosts without libudev.
nusb = { version = "0.2", optional = true }

[features]
default = ["usb"]
usb = ["dep:nusb"]

[dev-dependencies]
proptest = "1.4"
