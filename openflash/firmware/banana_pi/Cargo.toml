[package]
name = "openflash-firmware-banana-pi"
description = "OpenFlash agent for Banana Pi (M2 Zero, M4 Berry, BPI-F3)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Protocol handling and SPI NOR sequencing are shared with the other SBC agents,
# so this crate cannot drift away from what the host speaks.
openflash-sbc-agent = { workspace = true }
# spidev issues SPI_IOC_MESSAGE, which keeps chip select asserted for a whole
# transaction. Plain read/write on the device node does not.
spidev = "0.7"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"

[features]
default = ["h3"]
# Banana Pi variants
h3 = []       # Banana Pi M2 Zero (Allwinner H3)
h618 = []     # Banana Pi M4 Berry (Allwinner H618)
k1 = []       # Banana Pi BPI-F3 (SpacemiT K1 RISC-V)

[[bin]]
name = "openflash-gpio"
path = "src/main.rs"
