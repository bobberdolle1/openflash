[package]
name = "openflash-firmware-orange-pi"
description = "OpenFlash agent for Orange Pi (Zero 3, Zero 2W, Orange Pi 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Protocol handling and SPI NOR sequencing are shared with the other SBC agents,
# so this crate cannot drift away from what the host speaks.
openflash-sbc-agent = { workspace = true }
# spidev issues SPI_IOC_MESSAGE, which keeps chip select asserted for a whole
# transaction. Plain read/write on the device node does not.
spidev = "0.7"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
memmap2 = "0.9"

[features]
default = ["h618"]
# Orange Pi variants
h618 = []    # Orange Pi Zero 3 (Allwinner H618)
h616 = []    # Orange Pi Zero 2W (Allwinner H616)
rk3588 = []  # Orange Pi 5 (Rockchip RK3588)

[[bin]]
name = "openflash-gpio"
path = "src/main.rs"
