[package]
name = "openflash-firmware-raspberry-pi"
description = "OpenFlash agent for Raspberry Pi (3B+, 4, 5, Zero 2W)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Protocol handling and SPI NOR sequencing are shared with the other SBC agents,
# so this crate cannot drift away from what the host speaks.
openflash-sbc-agent = { workspace = true }
rppal = "0.22"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[features]
default = ["rpi4"]
rpi3 = []
rpi4 = []
rpi5 = []
zero2w = []

[[bin]]
name = "openflash-gpio"
path = "src/main.rs"
