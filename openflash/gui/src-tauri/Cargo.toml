[package]
name = "openflash-gui"
description = "OpenFlash desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "openflash_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# Device access goes through openflash-core, which owns the USB transport; the
# GUI no longer talks to nusb itself.
openflash-core = { workspace = true }
dirs = "5"

[features]
default = ["custom-protocol", "usb"]
custom-protocol = ["tauri/custom-protocol"]
usb = ["openflash-core/usb"]
