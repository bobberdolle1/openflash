[package]
name = "openflash-gui"
description = "OpenFlash desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Higher than the workspace's 1.85: Tauri pulls in `time`, which requires 1.88.
# Declared here rather than raising the whole workspace, so the library, the CLI
# and the board agents keep the lower floor they actually build on.
rust-version = "1.88"

[lib]
name = "openflash_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { workspace = true }
serde_json = { workspace = true }
# Device access goes through openflash-core, which owns the USB transport; the
# GUI no longer talks to nusb itself.
openflash-core = { workspace = true }
dirs = "5"

[features]
default = ["custom-protocol", "usb"]
custom-protocol = ["tauri/custom-protocol"]
usb = ["openflash-core/usb"]
