[package]
name = "openflash-protocol"
description = "Wire protocol shared by the OpenFlash host tools and every device firmware"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Declared directly rather than inherited from the workspace: firmware depends
# on this crate with default-features = false and must not drag in serde/std.
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }

[features]
default = ["std", "serde"]
std = []
serde = ["dep:serde"]

[dev-dependencies]
proptest = "1.4"
