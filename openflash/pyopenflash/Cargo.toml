[package]
name = "pyopenflash"
description = "Python bindings for the OpenFlash NAND/eMMC/NOR programmer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "openflash"
crate-type = ["cdylib"]

[dependencies]
openflash-core = { workspace = true }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["usb"]
usb = ["openflash-core/usb"]
